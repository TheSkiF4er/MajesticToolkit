name: Stable release checks
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression suite and deterministic packages
        run: npm run verify
      - name: Verify SHA-256 manifest
        run: cd release && sha256sum -c SHA256SUMS
      - name: Mozilla AMO lint
        run: |
          npm exec --yes --package=addons-linter@10.14.0 -- addons-linter release/MajesticToolkit-1.5.4-firefox.zip
          npm exec --yes --package=addons-linter@10.14.0 -- addons-linter release/MajesticToolkit-1.5.4-firefox-android.zip
      - name: Publish downloadable CI artifacts (not marketplace publication)
        uses: actions/upload-artifact@v4
        with:
          name: MajesticToolkit-1.5.4-release-${{ github.run_id }}
          path: release/
          if-no-files-found: error
  browser-e2e:
    # Playwright 1.57.0 does not support Ubuntu 26.04, used by ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox
      - name: Run real Chromium and Firefox DOM E2E against XenForo fixtures
        env:
          MAJESTIC_E2E_BROWSERS: chromium,firefox
          MAJESTIC_PLAYWRIGHT_ONLY: '1'
        run: python tests/browser-e2e.py
