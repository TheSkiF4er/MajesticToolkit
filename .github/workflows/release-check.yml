name: Stable release checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
      - name: Artifact checksums
        run: cd release && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: MajesticToolkit-1.0.0-builds
          path: release/
