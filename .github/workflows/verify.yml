name: Verify MajesticToolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build all platforms
        run: npm run verify
      - name: Check JavaScript syntax
        run: |
          find src dist -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
      - name: Upload WebExtension resources
        uses: actions/upload-artifact@v4
        with:
          name: majestictoolkit-0.10.0-resources
          path: dist/
