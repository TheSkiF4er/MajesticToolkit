name: Verify MajesticToolkit
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test, build, validate, and package
        run: npm run verify
      - name: Check JavaScript syntax
        run: |
          find src dist -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
      - name: Mozilla AMO lint (Firefox desktop and Android)
        run: |
          npm exec --yes --package=addons-linter@10.14.0 -- addons-linter release/MajesticToolkit-1.5.0-firefox.zip
          npm exec --yes --package=addons-linter@10.14.0 -- addons-linter release/MajesticToolkit-1.5.0-firefox-android.zip
      - name: Upload reproducible release archives
        uses: actions/upload-artifact@v4
        with:
          name: MajesticToolkit-1.5.0-verified-${{ github.run_id }}
          path: |
            release/MajesticToolkit-1.5.0-*.zip
            release/SHA256SUMS
            release/release-manifest.json
          if-no-files-found: error
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox
      - name: Run real Chromium and Firefox DOM E2E against XenForo fixtures
        env:
          MAJESTIC_E2E_BROWSERS: chromium,firefox
          MAJESTIC_PLAYWRIGHT_ONLY: '1'
        run: python tests/browser-e2e.py
