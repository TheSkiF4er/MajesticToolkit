name: Publish MajesticToolkit v1.5.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.5.3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-packages:
    if: github.repository == 'TheSkiF4er/MajesticToolkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and produce reproducible v1.5.3 packages
        run: |
          test "$(node -p "require('./package.json').version")" = '1.5.3'
          npm run verify
          (cd release && sha256sum -c SHA256SUMS)
      - name: Mozilla AMO static checks
        run: |
          npm exec --yes --package=addons-linter@10.14.0 -- addons-linter release/MajesticToolkit-1.5.3-firefox.zip
          npm exec --yes --package=addons-linter@10.14.0 -- addons-linter release/MajesticToolkit-1.5.3-firefox-android.zip
      - uses: actions/upload-artifact@v4
        with:
          name: majestictoolkit-v1.5.3-binaries
          path: |
            release/MajesticToolkit-1.5.3-*.zip
            release/SHA256SUMS
            release/release-manifest.json
          if-no-files-found: error

  browser-e2e:
    if: github.repository == 'TheSkiF4er/MajesticToolkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install supported Chromium and Firefox test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox
      - name: Run Chromium and Firefox DOM E2E against XenForo fixtures
        env:
          MAJESTIC_E2E_BROWSERS: chromium,firefox
          MAJESTIC_PLAYWRIGHT_ONLY: '1'
        run: python tests/browser-e2e.py

  publish:
    if: github.repository == 'TheSkiF4er/MajesticToolkit' && github.ref == 'refs/heads/main'
    needs: [validate-packages, browser-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: majestictoolkit-v1.5.3-binaries
          path: release
      - name: Verify release files
        run: |
          test "$(node -p "require('./package.json').version")" = '1.5.3'
          (cd release && sha256sum -c SHA256SUMS)
          test "$(find release -maxdepth 1 -name 'MajesticToolkit-1.5.3-*.zip' | wc -l)" -eq 4
      - name: Create GitHub Release v1.5.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.5.3 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.5.3 already exists; refusing to overwrite published files."
            exit 0
          fi
          gh release create v1.5.3 \
            release/MajesticToolkit-1.5.3-chromium.zip \
            release/MajesticToolkit-1.5.3-firefox.zip \
            release/MajesticToolkit-1.5.3-firefox-android.zip \
            release/MajesticToolkit-1.5.3-safari.zip \
            release/SHA256SUMS \
            release/release-manifest.json \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MajesticToolkit v1.5.3 — Chromium & Safari Installation" \
            --notes-file docs/RELEASE_NOTES_1.5.3.md \
            --latest
