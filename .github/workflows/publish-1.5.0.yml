name: Publish MajesticToolkit v1.5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.5.0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-packages:
    if: github.repository == 'TheSkiF4er/MajesticToolkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test, build, and package 1.5.0
        run: |
          test "$(node -p "require('./package.json').version")" = '1.5.0'
          npm run verify
          (cd release && sha256sum -c SHA256SUMS)
      - name: Mozilla AMO static checks
        run: |
          npm exec --yes --package=addons-linter@10.14.0 -- addons-linter release/MajesticToolkit-1.5.0-firefox.zip
          npm exec --yes --package=addons-linter@10.14.0 -- addons-linter release/MajesticToolkit-1.5.0-firefox-android.zip
      - uses: actions/upload-artifact@v4
        with:
          name: majestictoolkit-v1.5.0-binaries
          path: |
            release/MajesticToolkit-1.5.0-*.zip
            release/SHA256SUMS
            release/release-manifest.json
          if-no-files-found: error

  browser-e2e:
    if: github.repository == 'TheSkiF4er/MajesticToolkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox
      - name: Chromium and Firefox XenForo DOM E2E
        env:
          MAJESTIC_E2E_BROWSERS: chromium,firefox
          MAJESTIC_PLAYWRIGHT_ONLY: '1'
        run: python tests/browser-e2e.py

  publish:
    if: github.repository == 'TheSkiF4er/MajesticToolkit' && github.ref == 'refs/heads/main'
    needs: [validate-packages, browser-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: majestictoolkit-v1.5.0-binaries
          path: release
      - name: Verify downloaded release payloads
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          test "$(node -p "require('./package.json').version")" = '1.5.0'
      - name: Publish GitHub Release (immutable assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.5.0 >/dev/null 2>&1; then
            echo "v1.5.0 release already exists; refusing to replace it."
            exit 0
          fi
          gh release create v1.5.0 \
            release/MajesticToolkit-1.5.0-chromium.zip \
            release/MajesticToolkit-1.5.0-firefox.zip \
            release/MajesticToolkit-1.5.0-firefox-android.zip \
            release/MajesticToolkit-1.5.0-safari.zip \
            release/SHA256SUMS \
            release/release-manifest.json \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MajesticToolkit v1.5.0 — Production Readiness" \
            --notes-file docs/RELEASE_NOTES_1.5.0.md \
            --latest
