<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>MajesticToolkit — рабочее пространство</title><link rel="stylesheet" href="styles.css"></head><body data-mode="workspace"><div id="app" aria-live="off"><p class="loading">Загрузка MajesticToolkit…</p></div><div id="notice" role="status" aria-live="polite"></div><dialog id="profile-dialog" aria-labelledby="dialog-title"><form id="profile-form"><h2 id="dialog-title">Профиль</h2><input type="hidden" name="profileId"><label>Название профиля<input name="name" required maxlength="64" autocomplete="off" placeholder="Основной профиль"></label><label>RP-проект<select name="project" required><option value="majestic">Majestic RP</option><option value="russia-online">Russia Online</option><option value="other">Другой проект</option></select></label><label>Название сервера<input name="server" required maxlength="70" autocomplete="off" placeholder="Например, Seattle"></label><label>HTTPS-ссылка на форум (необязательно)<input name="forumUrl" maxlength="512" type="url" placeholder="https://forum.example.com/"></label><p class="subtle">Эта ссылка открывается по вашей команде. Доступ к содержимому сайта не запрашивается.</p><div class="dialog-actions"><button type="button" class="button secondary" data-action="close-dialog">Отмена</button><button class="button primary" type="submit">Сохранить профиль</button></div></form></dialog><script type="module" src="main.mjs"></script></body></html>
